  publish-summary:
    name: publish-summary (verify only, commits nothing)
    # `always()` keeps this verification step alive even when a lane fails or
    # is skipped, so limitation records are still checked. It stays OFF on push
    # (smoke-only runs). This job has no contents:write permission — no commit.
    if: >-
      ${{ always() && (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.confirm_spend == true)
        ) }}
    needs: [memoryagentbench-mh, longmemeval-temporal, locomo-small]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # export/export.py is created by another agent. `--check` is read-only:
      # it verifies the committed sanitized summary matches generated figures
      # and must never write or commit anything.
      - name: Verify sanitized summary matches (--check)
        continue-on-error: false
        run: python export/export.py --check

      - name: Upload final report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            results/summary/
            docs/
          if-no-files-found: warn
          retention-days: 90
